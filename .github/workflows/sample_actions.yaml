name: Sample Workflow
on: [push,workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        #run: python -m pip install robotframework
        run: pip install -r requirements.txt

      - name: Verify Python version
        run: python --version

      - name: Check Current directory
        run: ls -lrt 

      - name: Run test
        continue-on-error: true
        run: robot -d logs/ example.robot

      - name: Check logs after execution
        run: ls -lrt logs/

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-logs-${{ github.run_id }}
          path: logs/


  analyze_results:
    runs-on: ubuntu-latest
    needs: test
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Robot Logs
        uses: actions/download-artifact@v4
        with:
          name: robot-test-logs-${{ github.run_id }}
          path: logs/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}


      - name: Install dependencies
        #run: python -m pip install robotframework
        run: pip install -r requirements.txt

      - name: Run test
        run: python analyze_robot.py

      - name: Prepare analysis folder
        run: |
          mkdir -p analysis
          mv robot_summary.json analysis/

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-analysis-logs-${{ github.run_id }}
          path: analysis/

  publish:
    runs-on: ubuntu-latest
    needs: [test,analyze_results]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Robot Logs
        uses: actions/download-artifact@v4
        with:
          name: robot-test-logs-${{ github.run_id }}
          path: logs/

      - name: Download Analysis Logs
        uses: actions/download-artifact@v4
        with:
          name: robot-analysis-logs-${{ github.run_id }}
          path: analysis/

      - name: Config user name and email id
        run: |
          git config --global user.email "kavipriya.ganapathy@sky.uk"
          git config --global user.name "kavipriya.ganapathy"
      
      - name: Clone Repository
        run: git clone -b test-logs https://x-access-token:${{ secrets.GH_PAT }}@github.com/kavipriyagkp/sample_robot_test.git test-logs

      - name: Check current Directory
        run: ls -R

      - name: Copy Logs to test-logs branch
        run: |
          mkdir -p test-logs/logs/Report_${{ github.run_id }}
          cp -r logs/* test-logs/logs/Report_${{ github.run_id }}/
          cp analysis/robot_summary.json test-logs/logs/Report_${{ github.run_id }}/


      - name: Git push command
        run: |
          cd test-logs
          git add .
          git commit -m "Upload results to Gitrepo" || echo "No changes to commit"
          git push origin test-logs 
  
  update_wiki:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Analysis Logs
        uses: actions/download-artifact@v4
        with:
          name: robot-analysis-logs-${{ github.run_id }}
          path: analysis/

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Clone Repository
        run: git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/kavipriyagkp/sample_robot_test.wiki.git wiki

      - name: Change directory and assign variables
        run: |

          cd wiki
          ls -lrt
          DATE=$(date "+%Y-%m-%d %H:%M:%S")
          GithubID=${{ github.run_id }}
          PASSED=$(jq '.passed' ../analysis/robot_summary.json)
          FAILED=$(jq '.failed' ../analysis/robot_summary.json)
          LOG_LINK="https://github.com/kavipriyagkp/sample_robot_test/tree/test-logs/logs/Report_${{ github.run_id }}/log.html?inline=false"
          REASON_LINK="https://github.com/kavipriyagkp/sample_robot_test/tree/test-logs/logs/Report_${{ github.run_id }}/robot_summary.json?inline=false"
          sed -i '/^$/d' Test-Reports.md
          printf "| %s | %s | %s | %s | [Reasons](%s) | [Log](%s) |\n" \
          "$DATE" "$GithubID" "$PASSED" "$FAILED" "$REASON_LINK" "$LOG_LINK" >> Test-Reports.md

      - name: Git push
        run: |
          cd wiki
          git config user.email "kavipriya.ganapathy@sky.uk"
          git config user.name "kavipriya.ganapathy"
          git add Test-Reports.md
          git commit -m "Update test report - ${{ github.run_id }}" || echo "No changes"
          git push


  


    

 
