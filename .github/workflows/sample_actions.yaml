name: Sample Workflow
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install robotframework

      - name: Verify Python version
        run: python --version

      - name: Check Current directory
        run: ls -lrt 

      - name: Run test
        run: robot -d logs/ example.robot

      - name: Check logs after execution
        run: ls -lrt logs/

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-logs-${{ github.run_id }}
          path: logs/


  analyze_results:
    runs-on: ubuntu-latest
    needs: test
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Robot Logs
        uses: actions/download-artifact@v4
        with:
          name: robot-test-logs-${{ github.run_id }}
          path: logs/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install robotframework

      - name: Run test
        run: python analyze_robot.py

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-analysis-logs-${{ github.run_id }}
          path: logs/
